# ============================================================
# Prometheus Configuration — vLLM Metrics Scraping
# ============================================================
# This is a lab/example configuration. Not for production use.
# All targets use localhost or Docker service names.
# ============================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# Alerting (optional, configure Alertmanager separately)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - alertmanager:9093

# Rule files (optional)
# rule_files:
#   - "alerts/*.yml"

scrape_configs:
  # ---- vLLM Engine Metrics ----
  - job_name: "vllm"
    metrics_path: "/metrics"
    scrape_interval: 10s
    static_configs:
      - targets: ["vllm:8000"]
        labels:
          service: "vllm"
          environment: "lab"
    # If running outside Docker, use:
    # static_configs:
    #   - targets: ["localhost:8000"]

  # ---- Node Exporter (optional, for host metrics) ----
  # Uncomment if node_exporter is running
  # - job_name: "node"
  #   static_configs:
  #     - targets: ["localhost:9100"]
  #       labels:
  #         service: "node-exporter"

  # ---- NVIDIA GPU Exporter (optional) ----
  # Uncomment if dcgm-exporter is running
  # - job_name: "nvidia-gpu"
  #   static_configs:
  #     - targets: ["localhost:9400"]
  #       labels:
  #         service: "dcgm-exporter"

  # ---- Prometheus self-monitoring ----
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
