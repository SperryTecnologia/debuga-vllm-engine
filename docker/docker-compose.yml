# ============================================================
# docker-compose.yml — Lab environment for vLLM + Qwen-Coder
# ============================================================
# Usage:
#   cp ../.env.example ../.env   # Configure environment
#   docker compose up -d         # Start services
#   docker compose logs -f vllm  # View logs
#   docker compose down          # Stop services
#
# This is a lab/development compose file, not for production.
# ============================================================

services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: debuga-vllm
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "${VLLM_PORT:-8000}:8000"
    volumes:
      # Persist downloaded models across restarts
      - model-cache:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    command: >
      --model ${MODEL_ID:-Qwen/Qwen2.5-Coder-7B-Instruct-AWQ}
      --quantization ${QUANTIZATION:-awq}
      --max-model-len ${MAX_MODEL_LEN:-8192}
      --gpu-memory-utilization ${GPU_MEMORY_UTILIZATION:-0.9}
      --tensor-parallel-size ${TENSOR_PARALLEL_SIZE:-1}
      --max-num-seqs ${MAX_NUM_SEQS:-32}
      --enable-prefix-caching
      --port 8000
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s  # Models take time to load
    restart: unless-stopped

  # Optional: Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: debuga-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      vllm:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - monitoring

  # Optional: Grafana for dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: debuga-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    profiles:
      - monitoring

volumes:
  model-cache:
    name: debuga-model-cache
  prometheus-data:
    name: debuga-prometheus-data
  grafana-data:
    name: debuga-grafana-data
